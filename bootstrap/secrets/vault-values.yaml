# HashiCorp Vault, single server with file storage on a persistent volume.
#
# Not dev mode: dev mode keeps everything in memory and loses every secret on
# restart. This is a real, sealed Vault. Trade-off accepted for the assignment:
# one replica and manual unseal. Production would run 3 replicas on Raft with
# auto-unseal from a KMS; Vultr has no KMS, so that would mean a second Vault
# (transit unseal) and is listed under suggested advancements.
injector:
  # The injector adds a sidecar to pods via an admission webhook. Secrets here
  # are delivered by the Vault Secrets Operator instead, which needs neither a
  # sidecar nor a webhook (and a webhook would be blocked by STRICT mTLS).
  enabled: false

server:
  standalone:
    enabled: true
  dataStorage:
    size: 10Gi
    storageClass: vultr-block-storage
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
