# Syncs the database passwords from Vault into the "databases" namespace as
# the Secret the database pods read. The app namespace has its own copy of
# these three resources in k8s/base/secrets.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-auth
  namespace: databases
---
# How the operator logs in to Vault: it presents a short-lived token for the
# service account above, and Vault verifies it with the Kubernetes API. No
# long-lived Vault credential is stored anywhere in the cluster.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: databases
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso
    serviceAccount: vso-auth
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: db-credentials
  namespace: databases
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: app/databases
  # How often Vault is re-read; a changed password reaches the cluster within
  # this window.
  refreshAfter: 60s
  destination:
    name: db-credentials
    create: true
    # Take over the Secret that install.sh created before Vault existed.
    overwrite: true
