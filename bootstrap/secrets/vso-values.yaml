# Vault Secrets Operator: watches VaultStaticSecret resources and writes the
# referenced Vault data into ordinary Kubernetes Secrets, re-syncing on a timer.
# Pods keep consuming plain Secrets and need no Vault client.
defaultVaultConnection:
  enabled: true
  # Plain HTTP at the application layer; ztunnel wraps it in mTLS.
  address: http://vault.vault.svc.cluster.local:8200
