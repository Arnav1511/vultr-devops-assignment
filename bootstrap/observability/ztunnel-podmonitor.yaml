# Scrapes each node's ztunnel so mesh traffic (mTLS connection counts and
# bytes) is visible in Prometheus. A PodMonitor because ztunnel has no Service.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ztunnel
  namespace: istio-system
spec:
  selector:
    matchLabels:
      app: ztunnel
  podMetricsEndpoints:
    - port: ztunnel-stats
      path: /stats/prometheus
      interval: 30s
