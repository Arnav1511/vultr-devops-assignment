# Publishes Grafana on its own hostname through the shared Gateway. Host-based
# rather than a /grafana path so Grafana needs no sub-path rewriting.
# sslip.io is wildcard DNS: <name>.<ip>.sslip.io resolves to <ip>.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      namespace: ingress
      sectionName: https-grafana
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
