image: mongo:8.0.13
port: 27017
uid: 999   # the "mongodb" user in the official image
gid: 999
dataPath: /data/db
env:
  - name: MONGO_INITDB_ROOT_USERNAME
    value: root
  - name: MONGO_INITDB_ROOT_PASSWORD
    valueFrom:
      secretKeyRef: {name: db-credentials, key: mongodb-password}
  # The entrypoint's init step runs mongosh, which writes to $HOME.
  - name: HOME
    value: /tmp
resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {memory: 768Mi}
exporter:
  image: percona/mongodb_exporter:0.47.1
  port: 9216
  args:
    - --collect-all
  env:
    - name: MONGO_PASSWORD
      valueFrom:
        secretKeyRef: {name: db-credentials, key: mongodb-password}
    # $(VAR) is expanded by Kubernetes from the entry above.
    - name: MONGODB_URI
      value: mongodb://root:$(MONGO_PASSWORD)@localhost:27017/admin
