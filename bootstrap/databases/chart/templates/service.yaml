apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: db
      port: {{ .Values.port }}
      targetPort: db
    - name: metrics
      port: {{ .Values.exporter.port }}
      targetPort: metrics
