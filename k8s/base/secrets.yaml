# Secrets are not stored in git. The Vault Secrets Operator reads them from
# Vault and writes ordinary Kubernetes Secrets into this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-auth
---
# How the operator logs in to Vault on this namespace's behalf: it presents a
# short-lived token for the service account above, which Vault verifies with
# the Kubernetes API. Vault's "vso" role only accepts this service-account
# name from the three app namespaces and "databases".
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso
    serviceAccount: vso-auth
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: db-credentials
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: app/databases
  refreshAfter: 60s
  destination:
    name: db-credentials
    create: true
  # Environment variables are read once at process start, so a rotated
  # password only takes effect after a restart. The operator triggers a
  # rolling restart of the backend whenever the Secret's content changes.
  rolloutRestartTargets:
    - kind: Deployment
      name: backend
---
# Registry pull credentials, also from Vault, so no namespace needs a
# hand-created imagePullSecret.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vultr-registry
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: app/registry
  refreshAfter: 1h
  destination:
    name: vultr-registry
    create: true
    type: kubernetes.io/dockerconfigjson
    # Copy only the one key a pull secret must contain, not the operator's
    # extra "_raw" key.
    transformation:
      excludeRaw: true
