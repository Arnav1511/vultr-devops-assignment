# A dedicated service account gives this workload its own mesh identity
# (spiffe://cluster.local/ns/<namespace>/sa/frontend). With the shared "default"
# account, the frontend and backend would be indistinguishable to mTLS and to
# the database AuthorizationPolicy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  # No "replicas" field on purpose: the HPA below owns the replica count. If it
  # were set here, every apply would reset the count and fight the autoscaler.
  selector:
    matchLabels:
      app: frontend
  strategy:
    rollingUpdate:
      # Never drop below the current replica count during a rollout: start a
      # new pod first, and only remove an old one once the new one is Ready.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
        owner: platform
    spec:
      serviceAccountName: frontend
      imagePullSecrets:
        - name: vultr-registry
      # The app never calls the Kubernetes API, so do not hand it a token.
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          # Spread replicas across nodes so one node failure cannot take out
          # the whole service. "Preferred", not "required": a hard rule would
          # leave pods Pending whenever the HPA wants more replicas than there
          # are nodes, and would block rolling updates on a full cluster.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Block syscalls outside the container runtime's default allow-list.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: blr.vultrcr.com/vultrdevopsprod/frontend
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            # The binary writes nothing to disk, so no emptyDir is needed.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # Requests are what the scheduler reserves and what the HPA's CPU
            # percentage is measured against.
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          # startup: gates the other two until the app has booted, so a slow
          #          start is not mistaken for a hang. Up to 30 x 2s = 60s.
          # liveness: restart the container if the process is stuck.
          # readiness: remove the pod from the Service while it cannot serve.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  # Two is the minimum for availability: one pod can be drained or crash while
  # the other keeps serving.
  minReplicas: 2
  maxReplicas: 6
  metrics:
    # Scale out when average CPU use across pods exceeds 70% of the request
    # (70m of 100m). 70% leaves headroom for the ~30s it takes a new pod to
    # become Ready; a higher target would saturate before help arrives.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Scale up immediately but wait 5 minutes of sustained low load before
    # scaling down, so a brief lull does not cause replica flapping.
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
spec:
  # During voluntary disruptions (node drain, upgrade) at most one pod may be
  # down at a time. Expressed as maxUnavailable rather than minAvailable so it
  # stays correct at any replica count the HPA chooses.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: frontend
