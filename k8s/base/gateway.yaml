# Gateway API ingress. Chain: GatewayClass "istio" (installed by istiod)
#   -> Gateway (this file; Istio creates an Envoy Deployment and a LoadBalancer
#      Service for it, and Vultr's cloud controller provisions the public LB)
#   -> HTTPRoute (which backend Service a request goes to).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          # Only routes in this namespace may attach, so another team's
          # HTTPRoute cannot hijack this hostname.
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: app
  rules:
    # Path-based routing. The most specific prefix wins, so /api goes to the
    # backend and everything else falls through to the frontend. Both are
    # served from one origin, which is why the UI needs no CORS configuration.
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - name: backend
          port: 80
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: frontend
          port: 80
