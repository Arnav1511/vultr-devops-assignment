# Named "app" here; each overlay renames it (app-dev, app-staging, app-prod)
# through its `namespace:` setting.
apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    # Enrols every pod in this namespace in the ambient mesh: istio-cni
    # redirects their traffic through the node's ztunnel, which gives them mTLS
    # with no sidecar and no pod restart.
    istio.io/dataplane-mode: ambient
    # Opts this namespace in to the admission webhook (bootstrap/policy): Pods
    # and Deployments here are rejected if they use :latest, lack resource
    # limits or the app/owner labels, or allow privilege escalation.
    policy-enforcement: enabled
