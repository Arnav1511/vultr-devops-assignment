apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Renames the base's "app" namespace and places every resource in it.
namespace: app-dev
resources:
  - ../../base
# The image tag is the git SHA the image was built from, never :latest. The
# deploy workflow rewrites these two lines; reverting that commit is a rollback.
images:
  - name: blr.vultrcr.com/vultrdevopsprod/backend
    newTag: "7167662"
  - name: blr.vultrcr.com/vultrdevopsprod/frontend
    newTag: "7167662"
# Smallest footprint: one replica is enough to exercise a change.
patches:
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
