apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Renames the base's "app" namespace and places every resource in it.
namespace: app-staging
resources:
  - ../../base
# The image tag is the git SHA the image was built from, never :latest. The
# deploy workflow rewrites these two lines; reverting that commit is a rollback.
images:
  - name: blr.vultrcr.com/vultrdevopsprod/backend
    newTag: "866a89e"
  - name: blr.vultrcr.com/vultrdevopsprod/frontend
    newTag: "866a89e"
# Same shape as prod (two replicas, so PDB and anti-affinity are exercised) with a lower ceiling.
patches:
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 3
