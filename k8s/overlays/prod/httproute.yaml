# Only prod is published to the internet. It attaches to the shared Gateway in
# the "ingress" namespace (see bootstrap/gateway/); the Gateway admits routes
# only from namespaces carrying the gateway-access label, added below.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: public
      namespace: ingress
      # Attach to the HTTPS listener only; port 80 just redirects.
      sectionName: https-app
  rules:
    # Path-based routing. The most specific prefix wins, so /api goes to the
    # backend and everything else falls through to the frontend. Both are
    # served from one origin, which is why the UI needs no CORS configuration.
    # /metrics, /healthz and /readyz on the backend are not routed at all.
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - name: backend
          port: 80
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: frontend
          port: 80
